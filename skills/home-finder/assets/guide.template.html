<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<title>家庭找物 · 实拍导览</title>
<style>
:root {
  --paper:#faf8f4; --sheet:#fffdf9; --ink:#262421; --muted:#6e685f;
  --line:#e2d8c7; --amber:#8a6116; --amber-soft:#f6ebd2; --amber-light:#fdf4df;
  --shadow:0 1px 2px #4937210c,0 8px 25px #4937210b;
  --serif:"Songti SC","Noto Serif CJK SC","STSong","SimSun",Georgia,serif;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --motion:cubic-bezier(.22,1,.36,1);
}
* { box-sizing:border-box }
html { -webkit-text-size-adjust:100%; color-scheme:light }
body {
  margin:0; color:var(--ink); font:16px/1.6 var(--sans);
  background-color:var(--paper);
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,#f2c45a1c,transparent 70%),
    linear-gradient(#2624210a 1px,transparent 1px),linear-gradient(90deg,#2624210a 1px,transparent 1px);
  background-size:auto,32px 32px,32px 32px;
}
body:has(dialog[open]) { overflow:hidden }
button { color:inherit; font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent }
button:focus-visible { outline:2px solid #945c0c; outline-offset:3px }
button[hidden], [hidden] { display:none !important }
.wrap { width:min(1160px, calc(100% - 56px)); margin:auto }
.masthead {
  min-height:74px; display:flex; align-items:center; justify-content:space-between; gap:16px;
  border-bottom:1px solid var(--line);
}
.brand { display:flex; align-items:center; gap:12px }
.brand-mark { width:36px; height:36px; display:grid; place-items:center; border:1px solid #decdb1; border-radius:9px; background:#fbf0d9; color:var(--amber); flex:none }
.brand-name { font:800 28px/1.1 var(--serif); letter-spacing:.045em }
.brand-context { padding-left:14px; margin-left:4px; border-left:1px solid var(--line); color:var(--muted); font-size:13px }
.outline,.primary,.back {
  display:inline-flex; min-height:46px; align-items:center; justify-content:center; gap:9px;
  border-radius:8px; padding:9px 14px; font-size:14px; font-weight:650;
}
.outline,.back { border:1px solid #ded1bb; background:var(--sheet) }
.outline:hover,.back:hover { background:var(--amber-light) }
.outline svg,.primary svg,.back svg { width:17px; height:17px; flex:none }
.primary { background:var(--amber); color:#fffdf8; border:1px solid #805915; padding-inline:19px }
.primary:hover { background:#735010 }
.back { color:var(--muted) }
.nav { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:18px 0 }
.nav button {
  display:flex; align-items:center; min-width:0; text-align:left; gap:12px; min-height:64px;
  padding:9px 14px; border:1px solid var(--line); border-radius:9px; background:var(--sheet);
}
.nav button:hover { border-color:#c5ad83 }
.nav button[aria-selected="true"] { background:var(--amber-soft); border-color:#cbb487; box-shadow:inset 0 0 0 1px #ad8c511a }
.nav-no { display:grid; place-items:center; width:29px; height:29px; flex:none; border:1px solid #dfd0b5; border-radius:6px; background:#fff9ee; color:var(--amber); font:700 13px/1 Georgia,serif }
.nav button[aria-selected="true"] .nav-no { border-color:var(--amber); background:var(--amber); color:white }
.nav-name { display:block; font-size:16px; font-weight:750; line-height:1.3 }
.nav-place { display:block; color:var(--muted); font-size:12px; margin-top:2px }
.viewer {
  display:grid; grid-template-columns:minmax(0, .96fr) minmax(0, 1.04fr);
  background:var(--sheet); border:1px solid var(--line); border-radius:10px 14px 14px 10px;
  box-shadow:var(--shadow),inset 11px 0 0 -10px #d4c6ae62; overflow:hidden;
}
.details { min-width:0; padding:28px 30px 24px; display:flex; flex-direction:column }
h1,h2,p,figure { margin:0 }
.summary-head { display:flex; align-items:center; justify-content:space-between; gap:9px }
.summary-head h1 { min-width:0 }
.quick-view { flex:none; margin-bottom:10px; color:#62440e; border-color:#d2b982; background:#fbf2df }
.quick-view svg { width:16px; height:16px }
h1 { font:800 clamp(34px,3.8vw,52px)/1.16 var(--serif); letter-spacing:.015em; margin-bottom:12px }
.quick-location { display:flex; align-items:flex-start; gap:7px; font-size:16px; color:#62440e; font-weight:720; margin-bottom:6px }
.quick-location svg { flex:none; width:17px; height:20px; margin-top:3px }
.recorded { color:var(--muted); font-size:12px }
.steps { list-style:none; margin:20px 0; padding:0; display:grid; gap:0; border-top:1px solid var(--line); border-bottom:1px solid var(--line) }
.steps li+li { border-top:1px solid #eee6d8 }
.steps button {
  display:flex; align-items:center; text-align:left; gap:10px; width:100%; border:0;
  padding:8px 9px; min-height:44px; background:transparent; font-size:14px; color:var(--muted);
}
.steps button:hover { background:#fbf6ea }
.steps button[aria-current="step"] { color:#62440e; background:#fbf0d9; font-weight:730 }
.step-no { width:25px; height:25px; border:1px solid #e2d4bc; border-radius:50%; background:#fff9ee; color:var(--amber); display:grid; place-items:center; flex:none; font:700 13px/1 Georgia,serif }
.steps button[aria-current="step"] .step-no { background:var(--amber); border-color:var(--amber); color:white }
.step-label { flex:1 }
.step-arrow { color:var(--amber); width:14px; height:14px; visibility:hidden }
.steps button[aria-current="step"] .step-arrow { visibility:visible }
.instruction { padding-bottom:18px }
.instruction h2 { font:760 23px/1.3 var(--serif); margin-bottom:7px }
.instruction p { color:#514a3e; font-size:15px; line-height:1.75 }
.actions { display:flex; gap:9px; margin-top:auto; padding-top:6px }
.actions .primary { flex:1 }
.stage {
  position:relative; min-width:0; display:flex; flex-direction:column; justify-content:center; align-items:center;
  padding:18px 20px 13px; border-left:1px solid var(--line);
  background:#f8f2e7; background-image:radial-gradient(ellipse at 48% 0%,#fff9ed 0%,transparent 76%);
}
.photo {
  position:relative; width:auto; max-width:100%; height:clamp(385px,61vh,610px);
  aspect-ratio:676/1200; border-radius:9px; overflow:hidden;
  background:#d6cabc; box-shadow:0 1px 6px #4d382740,0 12px 35px #50341614;
}
.photo img { display:block; width:100%; height:100%; object-fit:fill; }
.frame-in { animation:frame-in 330ms var(--motion) both }
@keyframes frame-in { from { opacity:.46; transform:scale(1.018) } to { opacity:1; transform:scale(1) } }
.pointer { position:absolute; inset:0; width:100%; height:100%; pointer-events:none }
.pointer-shadow { stroke:#352512ad; stroke-width:3.5; stroke-linecap:round }
.pointer-line { stroke:#fff0ca; stroke-width:1.5; stroke-linecap:round }
.pointer-tip { fill:#ffe5a4; stroke:#684711; stroke-width:1.2 }
.stage-zoom { position:absolute; top:11px; right:11px; color:#684711; background:var(--sheet); box-shadow:0 2px 9px #291d1716 }
.hotspot {
  position:absolute; left:clamp(28px,var(--x),calc(100% - 28px)); top:clamp(28px,var(--y),calc(100% - 28px)); transform:translate(-50%,-50%);
  display:grid; place-items:center; width:56px; height:56px; padding:0;
  color:white; border:0; background:transparent; border-radius:50%;
  filter:drop-shadow(0 1px 3px #21190dd4);
}
.hotspot::before,.hotspot::after { content:""; position:absolute; inset:6px; border-radius:50%; border:2px solid #fff4d7 }
.hotspot::after { inset:1px; border:1px solid #ffe1a0; opacity:.8 }
.hotspot svg { width:21px; height:21px; background:#684711dc; border-radius:50%; padding:3px }
.hotspot:hover::before { background:#d7a13a38 }
.hotspot:focus-visible { outline-color:white }
figcaption { display:flex; justify-content:space-between; gap:16px; width:100%; padding-top:10px; color:var(--muted); font-size:12px; max-width:440px }
figcaption .stamp { font-variant-numeric:tabular-nums; color:#634b22 }
.footer { padding:12px 0 18px; font-size:12px; color:var(--muted) }
dialog {
  position:fixed; inset:0 0 0 auto; width:min(460px, 100vw); height:100dvh; max-width:none; max-height:none;
  margin:0; padding:0; overflow:auto; background:var(--sheet); color:var(--ink);
  border:1px solid var(--line); border-radius:12px 0 0 12px; box-shadow:-16px 0 55px #271d1a32;
}
dialog[open] { animation:drawer-in 280ms var(--motion) both }
dialog::backdrop { background:#21191154 }
@keyframes drawer-in { from { transform:translateX(100%) } to { transform:translateX(0) } }
.proof-inner { padding:22px 24px 28px }
.proof-head { display:flex; justify-content:space-between; align-items:center; gap:10px; border-bottom:1px solid var(--line); padding-bottom:11px }
.proof-head h2 { font:800 29px/1.2 var(--serif) }
.icon-btn { display:grid; place-items:center; width:44px; height:44px; flex:none; background:transparent; border:1px solid var(--line); border-radius:8px }
.icon-btn:hover { background:var(--amber-light) }
.proof-path { margin:14px 0 5px; color:#62440e; font-size:14px; font-weight:700 }
.proof-meta { color:var(--muted); font-size:12px; margin-bottom:13px }
.proof-tabs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-bottom:12px }
.proof-tabs button { min-height:44px; border:1px solid var(--line); border-radius:7px; background:var(--sheet); font:650 13px var(--sans) }
.proof-tabs button[aria-pressed="true"] { background:var(--amber-soft); border-color:#cbb487; color:#62440e }
.proof-frame { display:block; max-width:100%; max-height:55dvh; width:auto; height:auto; margin:auto; border-radius:8px; border:1px solid var(--line) }
.proof-caption { color:var(--muted); font-size:13px; margin:9px 0 0 }
@media (max-width:720px) {
  .wrap { width:calc(100% - 24px) }
  .masthead { min-height:56px; gap:8px }
  .brand { gap:8px }
  .brand-name { font-size:22px }
  .brand-mark { width:30px; height:30px }
  .brand-context { display:none }
  .outline { min-height:44px; padding:6px 10px; font-size:13px }
  .nav { margin:10px 0; gap:6px }
  .nav button { min-height:46px; padding:6px 5px; gap:5px; justify-content:center }
  .nav-no { width:22px; height:22px; font-size:11px }
  .nav-name { font-size:13px; white-space:nowrap }
  .nav-place { display:none }
  .viewer { display:flex; flex-direction:column; border-radius:10px }
  .details { display:contents }
  .summary { order:0; padding:12px 13px 0 }
  h1 { font-size:31px; margin-bottom:5px }
  .quick-view { min-height:44px; margin-bottom:3px; padding-inline:9px; white-space:nowrap }
  .quick-view svg { width:14px; height:14px }
  .stage-zoom { top:11px; right:9px }
  .quick-location { font-size:14px; margin-bottom:1px; gap:6px }
  .quick-location svg { width:15px; height:17px; margin-top:3px }
  .recorded { font-size:11px }
  .steps { order:1; grid-template-columns:repeat(3,minmax(0,1fr)); margin:10px 10px 0; border:1px solid var(--line); border-radius:8px; overflow:hidden }
  .steps li+li { border-top:0; border-left:1px solid #eee6d8 }
  .steps button { min-height:44px; padding:5px; gap:5px; justify-content:center; font-size:12px; white-space:nowrap }
  .step-no { width:21px; height:21px; font-size:12px }
  .step-label { flex:0 1 auto }
  .step-arrow { display:none }
  .instruction { order:2; padding:9px 13px 10px }
  .instruction h2 { font-size:19px; margin-bottom:3px }
  .instruction p { font-size:13px; line-height:1.55 }
  .stage { order:3; padding:9px 10px 8px; border-left:0; border-top:1px solid var(--line) }
  .photo { height:clamp(235px,44svh,520px); max-width:100% }
  figcaption { padding-top:6px; gap:8px; font-size:11px }
  .actions {
    position:fixed; z-index:3; inset:auto 0 0; min-height:66px; margin:0;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom)); background:var(--paper);
    border-top:1px solid var(--line); box-shadow:0 -4px 20px #38261610;
  }
  .actions .primary { min-height:49px }
  .footer { padding-bottom:calc(78px + env(safe-area-inset-bottom)); padding-top:8px }
  dialog { inset:auto 0 0; width:100%; height:auto; max-height:85dvh; border-radius:16px 16px 0 0 }
  dialog[open] { animation:sheet-in 280ms var(--motion) both }
  .proof-inner { padding:12px 15px calc(16px + env(safe-area-inset-bottom)) }
  .proof-inner::before { content:""; display:block; width:35px; height:4px; margin:0 auto 6px; border-radius:5px; background:#d5c2a2 }
  .proof-head h2 { font-size:23px }
  .proof-frame { max-height:44dvh }
}
@media (max-width:345px) {
  .nav-no { display:none }
  .steps button { font-size:11px }
}
.proof-tail { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:8px }
.proof-tail .proof-caption { margin:0 }
.proof-tail button { flex:none }
dialog.zoom-dialog {
  inset:0; width:100%; height:100dvh; max-height:none; border:0; border-radius:0;
  background:#211d17; color:#fff9eb; box-shadow:none; overflow:hidden;
}
dialog.zoom-dialog[open] { display:flex; flex-direction:column; animation:none }
.zoom-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); background:#2b241b }
.zoom-head h2 { font:750 18px/1.25 var(--serif) }
.zoom-tools { display:flex; align-items:center; gap:6px }
.zoom-tools .icon-btn { width:44px; height:44px; border-color:#786a54; color:#fff9eb; font-size:22px; line-height:1 }
.zoom-tools .icon-btn:hover { background:#4a3d2b }
.zoom-tools .icon-btn:disabled { opacity:.43; cursor:default }
.zoom-tools output { width:47px; font-size:12px; text-align:center; font-variant-numeric:tabular-nums }
.zoom-scroll { flex:1; min-height:0; overflow:auto; overscroll-behavior:contain }
.zoom-sheet { display:grid; place-items:center; min-height:100%; min-width:100%; width:max-content; padding:8px }
.zoom-sheet img { display:block; width:auto; height:auto; max-width:none; object-fit:contain; user-select:none; -webkit-user-drag:none }
.zoom-caption { font-size:12px; line-height:1.4; color:#f4e7d0; padding:7px 12px calc(7px + env(safe-area-inset-bottom)); background:#2b241b }
@media(max-width:345px) { .zoom-head h2 { font-size:16px } .zoom-tools output { width:40px } .proof-tail { flex-wrap:wrap } }
@keyframes sheet-in { from { transform:translateY(100%) } to { transform:translateY(0) } }
@media (prefers-reduced-motion:reduce) { *, *::before,*::after { animation:none !important; transition:none !important } }
.search-panel { padding:25px 0 14px }
.search-kicker { color:var(--amber); font-size:12px; font-weight:750; letter-spacing:.1em }
.search-panel h1 { margin:5px 0 8px }
.search-copy { color:var(--muted); margin-bottom:12px; font-size:14px }
.search-controls { display:flex; align-items:center; gap:8px; max-width:740px }
.search-controls input { flex:1; min-width:0; height:49px; padding:0 13px; border:1px solid #d8c6a6; border-radius:8px; background:var(--sheet); color:var(--ink); font:inherit; font-size:16px }
.search-controls input:focus-visible { outline:2px solid var(--amber); outline-offset:2px }
.search-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px }
.search-chips button { min-height:44px; padding-inline:12px }
.search-chips button[aria-pressed="true"] { background:var(--amber-soft); border-color:#b99454; color:#684711 }
.results-count { margin:13px 0 7px; color:var(--muted); font-size:13px }
.results { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px }
.result { display:flex; align-items:center; gap:10px; min-width:0; min-height:62px; padding:9px 12px; border:1px solid var(--line); border-radius:9px; background:var(--sheet); color:var(--ink); text-decoration:none }
.result:hover { background:var(--amber-light); border-color:#c5ad83 }
.result:focus-visible { outline:2px solid var(--amber); outline-offset:2px }
.result-copy { flex:1; min-width:0; display:grid; gap:2px }
.result-name { font-weight:750; line-height:1.35 }
.result-path { color:var(--muted); font-size:12px; overflow-wrap:anywhere; line-height:1.45 }
.result-action { color:var(--amber); font-size:12px; white-space:nowrap; font-weight:700 }
.result-empty { color:var(--muted); background:var(--sheet); border:1px solid var(--line); border-radius:8px; padding:12px 14px }
.route-head { display:flex; align-items:center; justify-content:space-between; gap:7px; margin:10px 0 }
.route-head a { text-decoration:none; color:var(--amber) }
.photo-status { padding:28px 13px; text-align:center; color:var(--muted) }
body.search-mode .footer { padding-bottom:20px }
#stage-instruction { overflow-wrap:anywhere }
.steps { grid-template-columns:repeat(var(--step-count,3),minmax(0,1fr)) }
#item-name:focus { outline:none }
@media(max-width:720px) {
  .search-panel { padding-top:16px }
  .results { grid-template-columns:1fr }
  .result { min-height:57px }
  .route-head { margin:7px 0 }
  .steps button { white-space:normal; line-height:1.3 }
  .proof-tabs { grid-template-columns:repeat(auto-fit,minmax(80px,1fr)) }
}
.route-back { display:flex; flex-wrap:wrap; gap:6px }
.room-index { margin:17px 0 }
.home-browse-index,
.home-browse-panel,
#room-index,
#browse-panel {
  color: var(--ink, #292620);
}

.hb-root {
  display: grid;
  gap: 16px;
  min-width: 0;
  color: var(--ink, #292620);
}

.hb-root h1,
.hb-root h2,
.hb-root p,
.hb-root figure {
  margin: 0;
}

.hb-index-header,
.hb-view-header,
.hb-section-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.hb-index-header h2,
.hb-section-heading h2 {
  font: 760 23px/1.25 var(--serif, Georgia, serif);
  overflow-wrap: anywhere;
}

.hb-view-header {
  display: block;
}

.hb-title {
  margin: 3px 0 7px !important;
  font: 800 clamp(29px, 4vw, 43px)/1.14 var(--serif, Georgia, serif);
  overflow-wrap: anywhere;
}

.hb-title:focus {
  outline: none;
}

.hb-lede {
  color: var(--muted, #685f52);
  line-height: 1.55;
}

.hb-index-header .hb-lede {
  text-align: right;
  font-size: 13px;
}

.hb-breadcrumbs {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 3px 7px;
  color: var(--muted, #685f52);
  font-size: 13px;
}

.hb-root .outline,
.hb-breadcrumb-link {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line, #e1d6c3);
  border-radius: 7px;
  padding: 7px 11px;
  color: var(--amber, #805716);
  background: var(--sheet, #fffdf9);
  text-decoration: underline;
  text-underline-offset: 3px;
}

.hb-breadcrumb-link:hover,
.hb-root .outline:hover {
  border-color: var(--amber, #805716);
  background: var(--paper, #faf8f4);
}

.hb-breadcrumb-current {
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  color: var(--ink, #292620);
  font-weight: 700;
}

.hb-breadcrumb-separator {
  color: var(--muted, #8a7a63);
}

.hb-room-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.hb-room-card {
  display: flex;
  min-width: 0;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--line, #e1d6c3);
  border-radius: 11px;
  background: var(--sheet, #fffdf9);
  color: inherit;
  text-decoration: none;
  box-shadow: 0 5px 18px #513f2410;
}

.hb-room-card:hover,
.hb-room-card:focus-visible,
.hb-row:hover,
.hb-item-row:hover {
  border-color: var(--amber, #805716);
  background: var(--paper, #faf8f4);
}

.hb-room-image {
  display: block;
  width: 100%;
  height: 122px;
  object-fit: cover;
  object-position: center 55%;
  background: color-mix(in srgb, var(--paper, #faf8f4) 75%, var(--amber, #805716) 25%);
}

.hb-room-image-empty {
  background: linear-gradient(135deg, var(--paper, #faf8f4), var(--sheet, #fffdf9));
}

.hb-room-meta {
  display: grid;
  gap: 3px;
  padding: 10px 12px 12px;
}

.hb-room-meta strong {
  font: 750 18px/1.25 var(--serif, Georgia, serif);
}

.hb-room-meta small,
.hb-row-content small {
  color: var(--muted, #685f52);
  line-height: 1.45;
}

.hb-room-date {
  font-size: 11px;
}

.hb-view-grid {
  display: grid;
  grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
  align-items: start;
  gap: 14px;
}

.hb-section {
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--line, #e1d6c3);
  border-radius: 11px;
  background: var(--sheet, #fffdf9);
  box-shadow: 0 5px 18px #513f2409;
}

.hb-section-heading {
  margin-bottom: 11px;
}

.hb-section-heading h2 {
  font-size: 20px;
}

.hb-count {
  color: var(--muted, #685f52);
  text-align: right;
  font-size: 12px;
}

.hb-row-list,
.hb-item-list {
  display: grid;
  gap: 8px;
}

.hb-row,
.hb-item-row {
  display: flex;
  min-width: 0;
  min-height: 56px;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  border: 1px solid var(--line, #e1d6c3);
  border-radius: 8px;
  background: var(--sheet, #fffdf9);
  color: inherit;
  text-decoration: none;
}

.hb-row-number,
.hb-item-dot {
  display: grid;
  flex: none;
  width: 31px;
  height: 31px;
  place-items: center;
  border-radius: 7px;
  color: var(--amber, #805716);
  background: var(--paper, #faf8f4);
  font: 700 14px/1 var(--serif, Georgia, serif);
}

.hb-row-content,
.hb-item-content {
  display: grid;
  flex: 1;
  min-width: 0;
  gap: 3px;
  overflow-wrap: anywhere;
}

.hb-row-content strong,
.hb-item-content strong {
  font-size: 16px;
  line-height: 1.32;
}

.hb-row-content small {
  font-size: 12px;
}

.hb-row-arrow {
  flex: none;
  color: var(--amber, #805716);
  font-size: 22px;
}

.hb-item-row {
  align-items: flex-start;
  min-height: 48px;
}

.hb-item-dot {
  width: 25px;
  height: 25px;
  margin-top: 1px;
  font-size: 18px;
}

.hb-item-content {
  gap: 4px;
}

.hb-item-detail,
.hb-provenance {
  color: var(--muted, #685f52);
  font-size: 13px;
  line-height: 1.5;
}

.hb-provenance {
  font-size: 12px;
}

.hb-empty {
  color: var(--muted, #685f52);
  padding: 7px 2px;
}

.hb-steps {
  margin: 0;
  padding-left: 22px;
  color: var(--muted, #685f52);
}

.hb-steps li + li {
  margin-top: 6px;
}

.hb-photo-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.hb-photo {
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--line, #e1d6c3);
  border-radius: 9px;
  background: var(--sheet, #fffdf9);
}

.hb-photo-frame {
  position: relative;
  overflow: hidden;
  min-height: 90px;
  background: var(--paper, #faf8f4);
}

.hb-photo-image {
  display: block;
  width: 100%;
  height: auto;
}

.hb-photo-missing {
  display: grid;
  min-height: 120px;
  place-items: center;
  color: var(--muted, #685f52);
  font-size: 13px;
}

.hb-photo-caption {
  padding: 8px 10px;
  color: var(--muted, #685f52);
  font-size: 12px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.hb-leaders {
  position: absolute;
  z-index: 1;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.hb-leaders line {
  stroke: #ffdd8a;
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
}

.hb-leaders circle {
  fill: #ffdd8a;
  stroke: #5b3d09;
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}

.hb-hotspot {
  position: absolute;
  z-index: 2;
  display: grid;
  min-width: 44px;
  min-height: 44px;
  padding: 0 7px;
  place-items: center;
  transform: translate(-50%, -50%);
  border: 2px solid #ffe8aa;
  border-radius: 8px;
  color: #fff9e9;
  background: #644109;
  box-shadow: 0 2px 9px #24170477;
  font-size: 12px;
  font-weight: 800;
  line-height: 1;
  text-decoration: none;
  white-space: nowrap;
}

.hb-hotspot:hover,
.hb-hotspot:focus-visible {
  background: var(--amber, #805716);
}

.hb-root a:focus-visible {
  outline: 2px solid var(--amber, #805716);
  outline-offset: 3px;
}

@media (max-width: 760px) {
  .hb-room-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));

  }

  .hb-room-image {
    height: 100px;
  }

  .hb-view-grid {
    grid-template-columns: 1fr;
    gap: 10px;
  }
}

@media (max-width: 430px) {

    gap: 12px;

  .hb-index-header,
  .hb-section-heading {
    align-items: flex-start;
  }

  .hb-index-header {
    display: block;
  }

  .hb-index-header .hb-lede {
    margin-top: 4px;
    text-align: left;
  }

  .hb-section {
    padding: 12px;
  }

  .hb-photo-grid {
    grid-template-columns: 1fr;
  }

  .hb-room-meta {
    padding: 8px 9px 10px;
  }

  .hb-room-meta strong {
    font-size: 16px;
  }

.hb-primary-photo .hb-photo-grid { grid-template-columns:1fr; justify-items:center }
.hb-primary-photo .hb-photo { width:min(100%,330px) }
@media(max-width:760px) {
  .hb-primary-photo { order:-1 }
  .hb-primary-photo .hb-photo { width:min(100%,calc(52svh * .563)) }
}

<script>
'use strict';
(function (global) {
  'use strict';

  const TYPE_LABELS = {
    visual: '画面确认',
    spoken: '旁白定位',
    'visual+spoken': '画面与旁白',
    user_report: '口述记录'
  };

  function createHomeBrowse(items, images, linkForItem, displayName, locations) {
    const sourceItems = Array.isArray(items) ? items.filter(Boolean) : [];
    const imageMap = images && typeof images === 'object' ? images : {};
    const locationMap = locations && typeof locations === 'object' ? locations : {};
    const rooms = new Map();
    const shelves = new Map();

    function text(value) {
      return value == null ? '' : String(value);
    }

    function pathParts(value) {
      if (!Array.isArray(value)) return [];
      return value.map(text).map(part => part.trim()).filter(Boolean);
    }

    function currentItemName(item) {
      if (typeof displayName === 'function') {
        try {
          const value = displayName(item);
          if (value != null && text(value).trim()) return text(value).trim();
        } catch (_error) {
          // Keep the recorded name when the optional formatter cannot resolve it.
        }
      } else if (displayName && typeof displayName === 'object') {
        const value = displayName[item.id];
        if (value != null && text(value).trim()) return text(value).trim();
      }
      return text(item.name).trim() || text(item.id).trim() || '未命名物品';
    }

    function normalizedPhoto(photo) {
      if (typeof photo === 'string') return { file: photo, at: '', label: '' };
      return photo && typeof photo === 'object' ? photo : null;
    }

    function photoList(value) {
      if (!Array.isArray(value)) return [];
      return value.map(normalizedPhoto).filter(photo => photo && text(photo.file).trim());
    }

    function shelfPhotos(shelf) {
      const result = [];
      const seen = new Set();
      const append = list => {
        for (const photo of photoList(list)) {
          const key = text(photo.file) + '|' + text(photo.at);
          if (seen.has(key)) continue;
          seen.add(key);
          result.push(photo);
        }
      };
      if (shelf.raw) append(shelf.raw.photos || shelf.raw.locationPhotos);
      for (const item of shelf.items) append(item.locationPhotos);
      return result;
    }

    function addShelf(id, raw, fallbackPath) {
      const stableId = text(id).trim();
      if (!stableId) return null;
      let shelf = shelves.get(stableId);
      const rawPath = pathParts(raw && raw.path);
      const parts = rawPath.length ? rawPath : pathParts(fallbackPath);
      const roomName = parts[0] || '未归类';
      const cabinetName = parts[1] || '房间内';
      const locationName = parts.slice(2).join(' · ') || '这个位置';

      if (!shelf) {
        shelf = {
          id: stableId,
          path: parts.length ? parts : [roomName, cabinetName],
          room: roomName,
          cabinet: cabinetName,
          title: locationName,
          raw: raw && typeof raw === 'object' ? raw : null,
          items: []
        };
        shelves.set(stableId, shelf);
        if (!rooms.has(roomName)) rooms.set(roomName, new Map());
        const cabinets = rooms.get(roomName);
        if (!cabinets.has(cabinetName)) cabinets.set(cabinetName, []);
        cabinets.get(cabinetName).push(shelf);
      } else if ((!shelf.raw || !pathParts(shelf.raw.path).length) && parts.length) {
        shelf.path = parts;
        shelf.room = roomName;
        shelf.cabinet = cabinetName;
        shelf.title = locationName;
        shelf.raw = raw && typeof raw === 'object' ? raw : shelf.raw;
      }
      return shelf;
    }

    for (const [id, raw] of Object.entries(locationMap)) {
      addShelf(id, raw, raw && raw.path);
    }
    for (const [index, item] of sourceItems.entries()) {
      const stableId = text(item.location).trim() || 'unlocated-' + index;
      const shelf = addShelf(stableId, locationMap[stableId], item.path);
      if (!shelf) continue;
      shelf.items.push(item);
    }

    function roomNames() {
      const names = Array.from(rooms.keys());
      return names.sort((a, b) => a.localeCompare(b, 'zh-CN'));
    }

    function cabinetNames(roomName) {
      const cabinets = rooms.get(roomName);
      return cabinets ? Array.from(cabinets.keys()) : [];
    }

    function locationsIn(roomName, cabinetName) {
      const cabinets = rooms.get(roomName);
      return cabinets && cabinets.has(cabinetName) ? cabinets.get(cabinetName) : [];
    }

    function itemsInRoom(roomName) {
      const cabinets = rooms.get(roomName);
      if (!cabinets) return [];
      const result = [];
      for (const list of cabinets.values()) for (const shelf of list) result.push(...shelf.items);
      return result;
    }

    function itemCountInRoom(roomName) {
      return itemsInRoom(roomName).length;
    }

    function latestDate(itemsToCheck) {
      const dates = itemsToCheck.map(item => text(item.recorded_at).trim()).filter(Boolean).sort();
      return dates.length ? dates[dates.length - 1] : '';
    }

    function make(tag, className, label) {
      const element = global.document.createElement(tag);
      if (className) element.className = className;
      if (label != null) element.textContent = text(label);
      return element;
    }

    function appendText(parent, tag, className, label) {
      const element = make(tag, className, label);
      parent.append(element);
      return element;
    }

    function link(className, href, label) {
      const anchor = make('a', className, label);
      anchor.href = text(href) || '#search';
      return anchor;
    }

    function itemHref(item) {
      if (typeof linkForItem === 'function') {
        try {
          return text(linkForItem(item.id));
        } catch (_error) {
          return '#item/' + encodeURIComponent(text(item.id));
        }
      }
      return '#item/' + encodeURIComponent(text(item.id));
    }

    function hashRoom(roomName) {
      return '#room/' + encodeURIComponent(roomName);
    }

    function hashCabinet(roomName, cabinetName) {
      return '#cabinet/' + encodeURIComponent(roomName) + '/' + encodeURIComponent(cabinetName);
    }

    function hashShelf(id) {
      return '#shelf/' + encodeURIComponent(id);
    }

    function imageAsset(file) {
      const requested = text(file).trim();
      if (!requested) return '';
      if (typeof imageMap[requested] === 'string' && imageMap[requested].startsWith('data:image/')) return imageMap[requested];
      const normalized = requested.replace(/^\.\//, '').replace(/^附件\//, '');
      if (typeof imageMap[normalized] === 'string' && imageMap[normalized].startsWith('data:image/')) return imageMap[normalized];
      const base = normalized.split('/').pop();
      for (const [key, value] of Object.entries(imageMap)) {
        if (typeof value !== 'string' || !value.startsWith('data:image/')) continue;
        const candidate = text(key).replace(/^\.\//, '').replace(/^附件\//, '');
        if (candidate === normalized || candidate.endsWith('/' + normalized) || candidate.split('/').pop() === base) return value;
      }
      return '';
    }

    function photoCaption(photo, fallback) {
      const label = text(photo && photo.label).trim() || fallback || '位置实拍';
      const bits = [label];
      if (photo && text(photo.at).trim()) bits.push(text(photo.at).trim());
      const source = text(photo && (photo.source || photo.kind)).trim();
      if (source) bits.push(TYPE_LABELS[source] || source);
      return bits.join(' · ');
    }

    function addBreadcrumbs(parent, entries) {
      const nav = make('nav', 'hb-breadcrumbs');
      nav.setAttribute('aria-label', '浏览路径');
      entries.forEach((entry, index) => {
        if (index) appendText(nav, 'span', 'hb-breadcrumb-separator', '›');
        if (entry.href) {
          const anchor = link('hb-breadcrumb-link', entry.href, entry.label);
          nav.append(anchor);
        } else {
          const current = appendText(nav, 'span', 'hb-breadcrumb-current', entry.label);
          current.setAttribute('aria-current', 'page');
        }
      });
      parent.append(nav);
      return nav;
    }

    function addHeading(parent, title, lede) {
      const header = make('header', 'hb-view-header');
      const h1 = appendText(header, 'h1', 'hb-title', title);
      h1.tabIndex = -1;
      if (lede) appendText(header, 'p', 'hb-lede', lede);
      parent.append(header);
      return h1;
    }

    function photoFigure(photo, caption, markers) {
      const figure = make('figure', 'hb-photo');
      const frame = make('div', 'hb-photo-frame');
      const src = imageAsset(photo && photo.file);
      if (src) {
        const image = make('img', 'hb-photo-image');
        image.src = src;
        image.alt = text(photo && photo.label) || caption || '收纳位置实拍';
        image.loading = 'lazy';
        frame.append(image);
        addHotspots(frame, markers || []);
      } else {
        appendText(frame, 'div', 'hb-photo-missing', '照片暂不可用');
      }
      figure.append(frame);
      appendText(figure, 'figcaption', 'hb-photo-caption', caption || photoCaption(photo));
      return figure;
    }

    function addHotspots(frame, markers) {
      if (!markers.length) return;
      const svg = global.document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'hb-leaders');
      svg.setAttribute('viewBox', '0 0 1000 1000');
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.setAttribute('aria-hidden', 'true');
      for (const marker of markers) {

  const item = byId.get(parts[0] === 'item' ? parts[1] : id);
  const browsing = !item && browse.renderView(browsePanel,parts);
  get('route-warning').hidden = Boolean(item) || browsing || !id || id === 'search' || id.startsWith('search=');
  searchPanel.hidden = Boolean(item) || browsing;
  browsePanel.hidden = !browsing;
  viewer.hidden = !item;
  get('route-head').hidden = !item;
  get('open-proof').hidden = !item;
  document.body.classList.toggle('search-mode',!item);
  if (item) {
    renderRoute(item);
    const shelfLink = get('route-shelf');
    shelfLink.href = '#shelf/' + encodeURIComponent(item.location);
    shelfLink.hidden = !wholeHome;
  } else {
    active = null;
  }
  if (!focus) return;
  if (item || browsing) {
    const title = item ? get('item-name') : browsePanel.querySelector('h1');
    if (title) {
      title.tabIndex = -1;
      title.focus({preventScroll:true});
    }
    window.scrollTo(0,0);
  } else if (resultTrigger?.isConnected) {
    resultTrigger.focus();
  } else {
    queryInput.focus();
  }
}
function frameDescription(step) {
  return [step.at ? '原片 ' + step.at : '',step.alt || step.instruction].filter(Boolean).join(' · ');
}
function showProofFrame(index) {
  proofIndex = index;
  const step = active.steps[index];
  const image = get('proof-frame');
  image.hidden = !step.src;
  get('zoom-proof').hidden = !step.src;
  if (step.src) {
    image.src = step.src;
    image.alt = step.alt;
  } else image.removeAttribute('src');
  for (const [i,control] of [...proofTabs.children].entries()) control.setAttribute('aria-pressed',String(i===index));
  text('proof-caption',frameDescription(step));
}
function openProof(trigger) {
  proofTrigger = trigger;
  text('proof-title',active.name + ' · 证据');
  text('proof-path',active.path.join(' › '));
  text('proof-meta',[active.source,active.date,active.proof].filter(Boolean).join(' · '));
  text('proof-note',active.note || '');
  showProofFrame(stepIndex);
  proof.showModal();
}
function fitZoom(keepCenter = false) {
  if (!zoom.open || !zoomImage.naturalWidth) return;
  const centerX = keepCenter ? (zoomScroll.scrollLeft+zoomScroll.clientWidth/2)/zoomScroll.scrollWidth : .5;
  const centerY = keepCenter ? (zoomScroll.scrollTop+zoomScroll.clientHeight/2)/zoomScroll.scrollHeight : .5;
  const fit = Math.min(zoomScroll.clientWidth-16,(zoomScroll.clientHeight-16)*zoomImage.naturalWidth/zoomImage.naturalHeight);
  zoomImage.style.width = Math.max(1,Math.floor(fit*zoomLevels[zoomIndex]))+'px';
  zoomScroll.scrollLeft = zoomScroll.scrollWidth*centerX-zoomScroll.clientWidth/2;
  zoomScroll.scrollTop = zoomScroll.scrollHeight*centerY-zoomScroll.clientHeight/2;
  get('zoom-out').disabled = zoomIndex===0;
  get('zoom-in').disabled = zoomIndex===zoomLevels.length-1;
  text('zoom-scale',zoomIndex ? zoomLevels[zoomIndex]+'×' : '适屏');
}
function openZoom(index,trigger) {
  const step = active.steps[index];
  if (!step.src) return;
  zoomTrigger = trigger;
  zoomIndex = 0;
  zoomImage.src = step.src;
  zoomImage.alt = step.alt;
  text('zoom-title',active.name + ' · 实拍');
  text('zoom-caption',frameDescription(step));
  zoom.showModal();
  fitZoom();
}
function advance(event) {
  if (stepIndex<active.steps.length-1) showStep(stepIndex+1);
  else openProof(event.currentTarget);
}

next.addEventListener('click',advance);
hotspot.addEventListener('click',advance);
back.addEventListener('click',() => { if (stepIndex>0) showStep(stepIndex-1); });
get('quick-view').addEventListener('click',() => showStep(active.steps.length-1));
get('open-proof').addEventListener('click',event => openProof(event.currentTarget));
get('close-proof').addEventListener('click',() => proof.close());
proof.addEventListener('close',() => proofTrigger?.focus());
proof.addEventListener('click',event => {
  if (event.target!==proof) return;
  const rect = proof.getBoundingClientRect();
  if (event.clientX<rect.left || event.clientX>rect.right || event.clientY<rect.top || event.clientY>rect.bottom) proof.close();
});
get('zoom-stage').addEventListener('click',event => openZoom(stepIndex,event.currentTarget));
get('zoom-proof').addEventListener('click',event => openZoom(proofIndex,event.currentTarget));
get('zoom-in').addEventListener('click',() => { if (zoomIndex<zoomLevels.length-1) { zoomIndex++; fitZoom(true); } });
get('zoom-out').addEventListener('click',() => { if (zoomIndex>0) { zoomIndex--; fitZoom(true); } });
get('zoom-close').addEventListener('click',() => zoom.close());
zoom.addEventListener('close',() => zoomTrigger?.focus());
zoomImage.addEventListener('load',() => fitZoom());
window.addEventListener('resize',() => { drawPointer(); fitZoom(true); });
window.addEventListener('hashchange',() => {
  if (zoom.open) zoom.close();
  if (proof.open) proof.close();
  renderHash(true);
});
renderHash();
</script>
</body>
</html>
